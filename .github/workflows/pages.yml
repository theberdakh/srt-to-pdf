name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.js audio-events.js event-styles.html event-styles.js event-styles.css laugh-stats.js notation.js pagination.js pdf-generator.js srt.js styles.css text-formatting.js title-sizing.js transcript-edit.js transcript-layout.js _site/
          cp -R assets _site/assets
          cp -R vendor _site/vendor
          find _site -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' \) -exec sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" {} +
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
